</div>

  <header>
    <b>Amit</b>
    <nav>

    </nav>
    <select id="since" title="Global start filter — applies to Games, Books and What-if lab (sweep grids are computed server-side over all picks)"></select>
    <span id="meta"></span>
    <span id="parity" title="JS scorers vs Python oracle">parity: …</span>

  </header>
  <main id="view"></main>
